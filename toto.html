<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jackpot Dream Group</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root{--bg:#f5f6f8;--card:#fff;--ink:#1c2330;--muted:#6b7380;--line:#dde1e8;--accent:#c8102e;--ok:#14804a;--warn:#b26a00;--bad:#c0262d}
  @media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e8ebf0;--muted:#98a1ae;--line:#2c333f;--accent:#ff4d63;--ok:#43c283;--warn:#f0a030;--bad:#ff6b72}}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .wrap{max-width:560px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}
  h1{font-size:20px;font-weight:700;margin:0 0 12px;text-align:center;color:var(--ink)}
  
  /* Collapsible Live Update */
  details.live-update{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-bottom:14px}
  details.live-update summary{display:flex;align-items:center;justify-content:space-between;cursor:pointer;font-weight:600;list-style:none}
  details.live-update summary::-webkit-details-marker{display:none}
  .dot{height:10px;width:10px;background-color:var(--ok);border-radius:50%;display:inline-block;margin-right:8px;animation:blink 1.5s infinite}
  @keyframes blink{0%{opacity:1}50%{opacity:.2}100%{opacity:1}}
  .sum-left{display:flex;align-items:center}
  .total-span{font-weight:700}
  .total-span .unv{color:var(--warn);font-size:14px}
  ul.names{list-style:none;margin:10px 0 0;padding:0;max-height:200px;overflow:auto;border-top:1px solid var(--line)}
  ul.names li{padding:6px 2px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px}
  .nv{color:var(--bad);font-size:13px;font-weight:600}

  .muted{color:var(--muted);font-size:13px}
  label{display:block;font-weight:600;font-size:14px;margin:12px 0 4px}
  input[type=text],input[type=tel],input[type=number],input[type=date]{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
  input:focus{outline:2px solid var(--accent);outline-offset:0}
  input[readonly]{opacity:.8}
  
  .row{display:flex;gap:10px;align-items:flex-end}
  .row>*{flex:1}
  
  button, .btn-link{font:inherit;font-weight:700;padding:10px 16px;border-radius:8px;border:0;cursor:pointer;background:var(--accent);color:#fff;text-decoration:none;display:block;text-align:center}
  button.sec, .btn-link.sec{background:#7a1fa2}
  button:disabled, .btn-link[aria-disabled="true"]{opacity:.4;cursor:not-allowed;pointer-events:none}
  .req{color:var(--bad)}
  .msg{font-size:13px;margin-top:4px;min-height:18px}
  .ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
  
  /* Submit button exact match to input height & vertical alignment */
  .submit{width:100%;font-size:16px;height:43px;display:flex;align-items:center;justify-content:center;margin-top:0}
  
  dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink);max-width:380px;text-align:center;width:92%}
  dialog::backdrop{background:rgba(0,0,0,.5)}
  #qr{display:flex;justify-content:center;margin:12px 0;background:#fff;padding:10px;border-radius:8px}
  .action-btns{display:flex;gap:8px;justify-content:center;margin-top:10px;flex-wrap:wrap}
  .action-btns button{flex:1;font-size:14px;padding:8px 12px}
</style>
</head>
<body>
<div class="wrap">
  <!-- TOP: One-line collapsible live update -->
  <details class="live-update">
    <summary>
      <span class="sum-left"><span class="dot"></span>Live Update</span>
      <span class="total-span" id="total">S$ –</span>
    </summary>
    <ul class="names" id="names"></ul>
  </details>

  <!-- MAIN COMBINED FORM -->
  <form class="card" id="form" autocomplete="off" novalidate>
    <h1>Jackpot Dream Group</h1>

    <!-- Batch Code -->
    <label for="batch" style="margin-top:0">Batch Code <span class="req">*</span></label>
    <input type="text" id="batch" inputmode="text" placeholder="Enter batch code" required>
    <div class="msg" id="batchMsg"></div>

    <!-- WhatsApp -->
    <label for="wa">WhatsApp Number <span class="req">*</span></label>
    <input type="tel" id="wa" inputmode="numeric" placeholder="8-digit mobile" required>
    <div class="msg" id="waMsg"></div>

    <!-- Number of Persons & Total Amount Side-by-Side -->
    <div class="row">
      <div>
        <label for="persons">Number of Persons <span class="req">*</span></label>
        <input type="number" id="persons" min="1" step="1" value="1" required>
      </div>
      <div>
        <label for="amount">Total Amount (S$) <span class="req">*</span></label>
        <input type="text" id="amount" readonly value="0.00">
      </div>
    </div>

    <!-- Name(s) -->
    <label for="namesIn">Name(s) <span class="req">*</span></label>
    <input type="text" id="namesIn" placeholder="e.g. Ravi, Meena" required>
    <div class="msg" id="namesMsg"></div>

    <!-- Transferred Date & PayLah Button Side-by-Side -->
    <div class="row" style="margin-top:12px">
      <div>
        <label for="date" style="margin-top:0">Transferred Date <span class="req">*</span></label>
        <input type="date" id="date" required>
      </div>
      <div>
        <a id="payLink" class="btn-link sec" aria-disabled="true" style="width:100%">PayLah!</a>
      </div>
    </div>

    <!-- PayLah Number & Submit Button Side-by-Side -->
    <div class="row" style="margin-top:12px">
      <div>
        <label for="tmobile" style="margin-top:0">PayLah Number</label>
        <input type="tel" id="tmobile" inputmode="numeric" placeholder="8-digit mobile">
      </div>
      <div>
        <button type="submit" class="submit" id="submitBtn" disabled>Submit</button>
      </div>
    </div>
    <div class="msg" id="tmMsg"></div>

    <div class="msg" id="result" style="text-align:center"></div>
  </form>
</div>

<!-- PAYMODAL DIALOG -->
<dialog id="payDlg">
  <h3 style="margin:0 0 4px">Pay with PayLah / PayNow</h3>
  <div class="muted" id="payInfo"></div>
  
  <div id="qr"></div>

  <div class="action-btns" id="mobControls">
    <button type="button" id="copyNoBtn" class="sec">Copy Number</button>
    <button type="button" id="copyAmtBtn" class="sec">Copy Amount</button>
  </div>

  <div class="muted" id="payHelp" style="margin-top:10px"></div>

  <p style="margin-top:14px;margin-bottom:0">
    <button type="button" id="closeDlg" style="background:var(--muted);width:100%">Close</button>
  </p>
</dialog>

<script>
/* ============ CONFIG ============ */
const CFG = {
  MASTER_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSFYhi9sHl2xHL7VBZTUxCUTPr8v2WzrkkVlqq_oDXXsFAm1Awx7TexXbqt3eiOZtyGvA6dpC05V8mx/pub?gid=0&single=true&output=csv",
  PUBLICFEED_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vSFYhi9sHl2xHL7VBZTUxCUTPr8v2WzrkkVlqq_oDXXsFAm1Awx7TexXbqt3eiOZtyGvA6dpC05V8mx/pub?gid=163284184&single=true&output=csv",
  FORM_POST_URL: "https://docs.google.com/forms/d/e/1FAIpQLSc2-6Mz4nCjfnb6xdwMugtNed1cEj_2C-BIixr0WVfD1lo-0A/formResponse",
  ENTRY: {
    whatsapp: "entry.910713439",
    persons:  "entry.2113506963",
    names:    "entry.823235837",
    amount:   "entry.2048096547",
    date:     "entry.1190347781",
    tmobile:  "entry.1097018115"
  },
  PAYNOW: { name: "Organiser", editable: false },
  REFRESH_MS: 30000
};

/* ============ HELPERS ============ */
const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString("en-SG",{minimumFractionDigits:2,maximumFractionDigits:2});
const num = v => { const n = parseFloat(String(v??"").replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; };

function parseCSV(text){
  const rows=[];let row=[],cur="",q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c=='"'){ if(text[i+1]=='"'){cur+='"';i++;} else q=false; } else cur+=c; }
    else if(c=='"') q=true;
    else if(c==","){row.push(cur);cur="";}
    else if(c=="\n"||c=="\r"){ if(c=="\r"&&text[i+1]=="\n")i++; row.push(cur);cur=""; if(row.some(x=>x.trim()!==""))rows.push(row); row=[]; }
    else cur+=c;
  }
  if(cur!==""||row.length){row.push(cur); if(row.some(x=>x.trim()!==""))rows.push(row);}
  if(!rows.length)return[];
  const head=rows[0].map(h=>h.trim().toLowerCase());
  return rows.slice(1).map(r=>{const o={};head.forEach((h,i)=>o[h]=(r[i]??"").trim());return o;});
}

function pick(o,...keys){
  for(const k of keys){ if(o[k]!==undefined) return o[k]; }
  for(const k of keys){ const f=Object.keys(o).find(h=>h.includes(k)); if(f) return o[f]; }
  return "";
}

async function getCSV(url){
  const r=await fetch(url+"&t="+Date.now(),{cache:"no-store"});
  if(!r.ok) throw new Error(r.status);
  return parseCSV(await r.text());
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function todayStr(){
  const d=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Singapore"}));
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

$("date").value = todayStr();

/* ============ SGQR / PayNow Payload Generator (EMVCo) ============ */
function tlv(id,val){return id+String(val.length).padStart(2,"0")+val;}
function crc16(s){
  let c=0xFFFF;
  for(let i=0;i<s.length;i++){
    c^=s.charCodeAt(i)<<8;
    for(let j=0;j<8;j++)c=(c&0x8000)?((c<<1)^0x1021)&0xFFFF:(c<<1)&0xFFFF;
  }
  return c.toString(16).toUpperCase().padStart(4,"0");
}

function sgPaynowPayload(amount, ref, mobileId){
  let cleanNo = String(mobileId).replace(/\D/g, "");
  if(cleanNo.length === 10 && cleanNo.startsWith("65")) cleanNo = cleanNo.slice(2);
  const proxy = "+65" + cleanNo;
  const acct = tlv("00","SG.PAYNOW") + tlv("01","0") + tlv("02",proxy) + tlv("03","0");
  let s = tlv("00","01") + tlv("01","12") + tlv("26",acct) + tlv("52","0000") + tlv("53","702")
        + tlv("54",amount.toFixed(2)) + tlv("58","SG") + tlv("59",CFG.PAYNOW.name.slice(0,25)) + tlv("60","Singapore")
        + tlv("62",tlv("01",ref.slice(0,25))) + "6304";
  return s + crc16(s);
}

/* ============ TOP: LIVE FEED ============ */
async function loadFeed(){
  try{
    const rows=await getCSV(CFG.PUBLICFEED_CSV_URL);
    let total=0, unverified=0;
    const li=[];
    rows.forEach(r=>{
      const name=pick(r,"name","names");
      const amt=num(pick(r,"total amount","amount","total"));
      const ver=pick(r,"verified","verify","status").toUpperCase();
      const isN = ver.startsWith("N");
      total+=amt; if(isN) unverified+=amt;
      if(name) li.push(`<li><span>${esc(name)}</span>${isN?'<span class="nv">(N)</span>':''}</li>`);
    });
    $("total").innerHTML=`S$ ${fmt(total)}`+(unverified>0?` <span class="unv">(${fmt(unverified)})</span>`:"");
    $("names").innerHTML=li.join("");
  }catch(e){}
}

/* ============ ACTIVE BATCHES ============ */
let batches=[];
async function loadBatches(){
  try{
    const rows=await getCSV(CFG.MASTER_CSV_URL);
    batches=rows.map(r=>({
      no:(r["batch no"]||"").trim(),
      code:(r["batch code"]||"").trim(),
      amt:num(pick(r,"amount per person","per person","amount")),
      pay:pick(r,"paylay id","paynow id","paynow","paylah").replace(/\s/g,""),
      link:(r["paylah link"]||r["paylay link"]||r["payment link"]||"").trim(),
      status:pick(r,"status")
    })).filter(b=>(b.code||b.no) && b.status.toLowerCase()==="active");
    validateBatch();
  }catch(e){}
}

/* ============ INPUT & PAYMENT ============ */
let current=null;

function normMobile(v){
  let d=String(v).replace(/\D/g,"");
  if(d.length===10&&d.startsWith("65"))d=d.slice(2);
  return d;
}
const validMobile=d=>/^[3689]\d{7}$/.test(d);

function validateBatch(){
  const v=$("batch").value.trim().toLowerCase();
  current=v?batches.find(b=>b.code.toLowerCase()===v||b.no.toLowerCase()===v)||null:null;
  const m=$("batchMsg");
  if(!v){m.textContent="";m.className="msg";}
  else if(current){m.textContent=`✓ Valid – S$ ${fmt(current.amt)} per person`;m.className="msg ok";}
  else{m.textContent="Batch code not found or not active";m.className="msg bad";}
  recalc();
}

function recalc(){
  const p=Math.max(0,parseInt($("persons").value)||0);
  const total=current?p*current.amt:0;
  $("amount").value=fmt(total).replace(/,/g,"");
  updatePaymentLink();
  check();
}

function nameList(){return $("namesIn").value.split(",").map(s=>s.trim()).filter(Boolean);}

async function copyText(str, msg) {
  try {
    await navigator.clipboard.writeText(str);
    $("payHelp").innerHTML = `<span class="ok">✓ ${msg}</span>`;
  } catch(e) {
    $("payHelp").innerHTML = `<span class="bad">Copy failed. Please copy manually: ${str}</span>`;
  }
}

function updatePaymentLink(){
  const amt = parseFloat($("amount").value) || 0;
  const payLink = $("payLink");
  const waVal = normMobile($("wa").value);
  const waOK = validMobile(waVal);
  const personsVal = parseInt($("persons").value) || 0;
  const namesVal = nameList().length;

  const canPay = current && waOK && personsVal >= 1 && amt > 0 && namesVal > 0;

  if(!canPay){
    payLink.setAttribute("aria-disabled", "true");
    payLink.removeAttribute("href");
    return;
  }

  const id = current.pay;
  const ref = waVal;
  const cleanPhone = String(id).replace(/\D/g,"");

  payLink.removeAttribute("aria-disabled");

  payLink.href = "#";
  payLink.onclick = (e) => {
    e.preventDefault();
    
    if(current.link){
      location.href = current.link;
      return;
    }

    $("payInfo").textContent = `S$ ${fmt(amt)} · Ref (WA): ${ref}`;
    $("qr").innerHTML = "";

    const payload = sgPaynowPayload(amt, ref, id);
    new QRCode($("qr"), {
      text: payload,
      width: 200,
      height: 200,
      correctLevel: QRCode.CorrectLevel.M
    });

    copyText(cleanPhone, `Mobile number (+65 ${cleanPhone}) copied to clipboard!`);
    
    $("copyNoBtn").onclick = () => copyText(cleanPhone, `Mobile (+65 ${cleanPhone}) copied!`);
    $("copyAmtBtn").onclick = () => copyText(amt.toFixed(2), `Amount (S$ ${fmt(amt)}) copied!`);

    $("payDlg").showModal();
  };
}

function check(){
  const waVal = normMobile($("wa").value);
  const waOK = validMobile(waVal);
  $("waMsg").textContent=$("wa").value&&!waOK?"Enter a valid 8-digit Singapore number":"";
  $("waMsg").className="msg bad";

  const tm=$("tmobile").value.trim();
  const tmOK=!tm||validMobile(normMobile(tm));
  $("tmMsg").textContent=!tmOK?"Enter a valid 8-digit Singapore number":"";
  $("tmMsg").className="msg bad";

  const p=parseInt($("persons").value)||0;
  const n=nameList().length;
  const nm=$("namesMsg");
  if(n&&p&&n!==p){nm.textContent=`${n} name(s) entered for ${p} person(s)`;nm.className="msg warn";}
  else nm.textContent="";

  updatePaymentLink();

  const base=!!current&&p>=1;
  $("submitBtn").disabled=!(base&&waOK&&tmOK&&n>0&&$("date").value);
}

$("batch").addEventListener("input",validateBatch);
["wa","tmobile","persons","namesIn","date"].forEach(id=>$(id).addEventListener("input",id==="persons"?recalc:check));

$("closeDlg").addEventListener("click",()=>$("payDlg").close());

/* ============ SUBMIT TO GOOGLE FORM ============ */
$("form").addEventListener("submit",async e=>{
  e.preventDefault();
  if($("submitBtn").disabled)return;

  const E=CFG.ENTRY, wa=normMobile($("wa").value), tm=normMobile($("tmobile").value);
  const dt=$("date").value, [y,m,d]=dt.split("-");
  const body=new URLSearchParams();

  body.set(E.whatsapp, wa);
  body.set(E.persons, String(parseInt($("persons").value)));
  body.set(E.names, nameList().join(", "));
  body.set(E.amount, $("amount").value);
  body.set(E.date+"_year", y);
  body.set(E.date+"_month", String(+m));
  body.set(E.date+"_day", String(+d));
  body.set("fvv", "1");
  body.set("pageHistory", "0");
  body.set(E.tmobile, tm || wa);

  const btn=$("submitBtn"),res=$("result");
  btn.disabled=true;btn.textContent="Submitting…";

  try{
    await fetch(CFG.FORM_POST_URL,{
      method:"POST",
      mode:"no-cors",
      headers:{"Content-Type":"application/x-www-form-urlencoded"},
      body
    });
    res.textContent="✓ Submitted. Thank you! Your entry will show once verified.";
    res.className="msg ok";
    
    $("form").reset();
    current=null;
    $("batchMsg").textContent="";
    $("date").value=todayStr();
    recalc();
    
    setTimeout(loadFeed,4000);
  }catch(err){
    res.textContent="Submission failed. Please check your connection and try again.";
    res.className="msg bad";
    btn.disabled=false;
  }
  btn.textContent="Submit";
});

/* ============ INIT ============ */
loadFeed();
loadBatches();
setInterval(loadFeed,CFG.REFRESH_MS);
setInterval(loadBatches,CFG.REFRESH_MS*4);
</script>
</body>
</html>
